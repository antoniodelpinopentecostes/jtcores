name: Build WWF WrestleFest ColorFix2 + CRT SyncFix1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-wwfwfest-colorfix2-crtsyncfix1.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check out required modules
        run: |
          git submodule update --init --depth=1 \
            modules/fx68k modules/jt51 modules/jt6295

      - name: Restore FreeRunSync baseline
        run: |
          BASE=.github/workflows/build-wwfwfest-freerun-sync.yml
          test -f "$BASE"
          CORE_ARCHIVE="$(sed -n 's/^          CORE_ARCHIVE: //p' "$BASE" | head -n1)"
          test -n "$CORE_ARCHIVE"
          printf '%s' "$CORE_ARCHIVE" | base64 --decode > /tmp/wwfwfest-source.zip
          unzip -q -o /tmp/wwfwfest-source.zip
          test -f cores/wwfwfest/hdl/jtwwfw_video.v

      - name: Apply TEXT fix2 + ColorFix2 BG plane order + disable OSD logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s=p.read_text()

          old_text='''assign char_sorted = {
              char_data[15],char_data[14],char_data[ 7],char_data[ 6],
              char_data[31],char_data[30],char_data[23],char_data[22],
              char_data[13],char_data[12],char_data[ 5],char_data[ 4],
              char_data[29],char_data[28],char_data[21],char_data[20],
              char_data[11],char_data[10],char_data[ 3],char_data[ 2],
              char_data[27],char_data[26],char_data[19],char_data[18],
              char_data[ 9],char_data[ 8],char_data[ 1],char_data[ 0],
              char_data[25],char_data[24],char_data[17],char_data[16]
          };'''
          new_text='''assign char_sorted = {
              char_data[ 6],char_data[ 7],char_data[14],char_data[15],
              char_data[22],char_data[23],char_data[30],char_data[31],
              char_data[ 4],char_data[ 5],char_data[12],char_data[13],
              char_data[20],char_data[21],char_data[28],char_data[29],
              char_data[ 2],char_data[ 3],char_data[10],char_data[11],
              char_data[18],char_data[19],char_data[26],char_data[27],
              char_data[ 0],char_data[ 1],char_data[ 8],char_data[ 9],
              char_data[16],char_data[17],char_data[24],char_data[25]
          };'''
          if old_text not in s:
              raise SystemExit('Expected FreeRunSync char_sorted block not found')
          s=s.replace(old_text,new_text)

          # ColorFix2: exact gfx3 byte/plane order.
          #
          # MRA output16 emits each pair as IC2,IC1 because map=01/map=10
          # is consumed from the highest map column to the lowest.
          # JTFRAME's normal MiSTer download path uses SWAB=1, so a 32-bit
          # read reaches the core with byte lanes (LSB -> MSB):
          #   b0=IC2 even = plane2
          #   b1=IC1 even = plane0
          #   b2=IC2 odd  = plane3
          #   b3=IC1 odd  = plane1
          #
          # jtframe_tilemap expects bytes {plane3,plane2,plane1,plane0}
          # and expects the source MSB to be the leftmost pixel.
          for sig in ('fgrom_data','bgrom_data'):
              pat=re.compile(
                  r'\.rom_data\(\{\s*'+re.escape(sig)+r'\[\s*8\].*?'+
                  re.escape(sig)+r'\[23\]\s*\}\)', re.S)
              repl='.rom_data({'+sig+'[23:16],'+sig+'[7:0],'+sig+'[31:24],'+sig+'[15:8]})'
              s,n=pat.subn(repl,s,count=1)
              if n != 1:
                  raise SystemExit(f'Expected {sig} legacy unpack block not found exactly once (found {n})')

          p.write_text(s)

          macros=Path('cores/wwfwfest/cfg/macros.def')
          mx=macros.read_text()
          if 'JTFRAME_OSD_NOLOGO' not in mx:
              mx=mx.rstrip()+"\n\n# Do not draw the JTFRAME J logo in the MiSTer OSD\nJTFRAME_OSD_NOLOGO\n"
          macros.write_text(mx)

          # Static guards: only intended subsystems changed.
          final=p.read_text()
          assert 'fgrom_data[23:16],fgrom_data[7:0],fgrom_data[31:24],fgrom_data[15:8]' in final
          assert 'bgrom_data[23:16],bgrom_data[7:0],bgrom_data[31:24],bgrom_data[15:8]' in final
          assert 'JTFRAME_OSD_NOLOGO' in macros.read_text()
          PY

      - name: Apply ColorFix2 sprite plane order
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('cores/wwfwfest/hdl/jtwwfw_obj.v')
          s=p.read_text()

          old='''wire [31:0] sorted = {
              obj_data[ 8],obj_data[ 9],obj_data[10],obj_data[11],
              obj_data[12],obj_data[13],obj_data[14],obj_data[15],
              obj_data[ 0],obj_data[ 1],obj_data[ 2],obj_data[ 3],
              obj_data[ 4],obj_data[ 5],obj_data[ 6],obj_data[ 7],
              obj_data[24],obj_data[25],obj_data[26],obj_data[27],
              obj_data[28],obj_data[29],obj_data[30],obj_data[31],
              obj_data[16],obj_data[17],obj_data[18],obj_data[19],
              obj_data[20],obj_data[21],obj_data[22],obj_data[23]
          };'''

          # MRA gfx2 stream is P3,P2,P1,P0. With JTFRAME SWAB=1,
          # obj_data byte lanes from LSB to MSB remain P3,P2,P1,P0.
          # jtframe_draw requires vector bytes {P3,P2,P1,P0}, but unlike
          # jtframe_tilemap it consumes the leftmost pixel from each byte LSB.
          # Concatenating obj_data[0]..obj_data[31] therefore both restores
          # the plane significance and reverses the bits inside each byte.
          new='''wire [31:0] sorted = {
              obj_data[ 0],obj_data[ 1],obj_data[ 2],obj_data[ 3],
              obj_data[ 4],obj_data[ 5],obj_data[ 6],obj_data[ 7],
              obj_data[ 8],obj_data[ 9],obj_data[10],obj_data[11],
              obj_data[12],obj_data[13],obj_data[14],obj_data[15],
              obj_data[16],obj_data[17],obj_data[18],obj_data[19],
              obj_data[20],obj_data[21],obj_data[22],obj_data[23],
              obj_data[24],obj_data[25],obj_data[26],obj_data[27],
              obj_data[28],obj_data[29],obj_data[30],obj_data[31]
          };'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected old sprite sort block exactly once; found {s.count(old)}')
          s=s.replace(old,new)
          p.write_text(s)

          final=p.read_text()
          assert final.count(new) == 1
          assert old not in final
          print('PASS: SpriteFix1 Verilog plane reorder installed')
          PY

      - name: Validate ColorFix2 sprites against MAME wwf_sprite_layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # The generated JTFRAME SDRAM wrapper must use the normal byte swap.
          g=Path('cores/wwfwfest/mister/jtwwfwfest_game_sdram.v').read_text()
          if not re.search(r'\.SWAB\s*\(\s*1\s*\)', g):
              raise SystemExit('Expected JTFRAME download SWAB=1 was not found')

          # Asymmetric source bytes: one byte from each MAME sprite plane.
          # MAME wwf_sprite_layout plane significance is P3,P2,P1,P0.
          P3,P2,P1,P0 = 0x96,0x3c,0xa5,0x69

          # MRA output=32 maps 31j3/5/6/9 as 0001/0010/0100/1000.
          # mra2rom emits map columns from 3 down to 0 -> P3,P2,P1,P0.
          stream=[P3,P2,P1,P0]

          # JTFRAME SWAB=1: even stream addresses write the SDRAM low lane,
          # odd addresses the high lane. The 32-bit reader returns
          # {second_16bit_word,first_16bit_word}.
          word0=(stream[1]<<8)|stream[0]
          word1=(stream[3]<<8)|stream[2]
          raw=(word1<<16)|word0
          assert raw == 0x69A53C96
          assert [(raw>>(8*i))&0xff for i in range(4)] == [P3,P2,P1,P0]

          def rev8(v):
              return int(f'{v:08b}'[::-1],2)

          # SpriteFix1: raw low byte -> output high byte, etc.; each byte is
          # bit-reversed because jtframe_draw consumes the leftmost pixel at LSB.
          planes=[rev8((raw>>(8*i))&0xff) for i in range(4)]
          packed=(planes[0]<<24)|(planes[1]<<16)|(planes[2]<<8)|planes[3]
          assert packed == 0x693CA596

          def jt_pixels(v):
              out=[]
              for _ in range(8):
                  out.append(
                      (((v>>24)&1)<<3) |
                      (((v>>16)&1)<<2) |
                      (((v>> 8)&1)<<1) |
                      (( v     )&1)
                  )
                  v >>= 1
              return out

          mame=[]
          for x in range(8):
              sh=7-x
              mame.append(
                  (((P3>>sh)&1)<<3) |
                  (((P2>>sh)&1)<<2) |
                  (((P1>>sh)&1)<<1) |
                  (( P0>>sh)&1)
              )

          fixed=jt_pixels(packed)
          assert fixed == mame

          # Prove that the previous core's plane order does NOT match MAME.
          oldplanes=[rev8(P2),rev8(P3),rev8(P0),rev8(P1)]
          oldpacked=(oldplanes[0]<<24)|(oldplanes[1]<<16)|(oldplanes[2]<<8)|oldplanes[3]
          assert jt_pixels(oldpacked) != mame

          obj=Path('cores/wwfwfest/hdl/jtwwfw_obj.v').read_text()
          expected='''wire [31:0] sorted = {
              obj_data[ 0],obj_data[ 1],obj_data[ 2],obj_data[ 3],'''
          assert expected in obj

          print('PASS: MRA stream = P3,P2,P1,P0')
          print('PASS: SDRAM raw 32-bit word = {P0,P1,P2,P3}')
          print('PASS: SpriteFix1 restores {P3,P2,P1,P0} with correct bit direction')
          print('PASS: all 8 synthetic sprite pixels match MAME wwf_sprite_layout')
          PY

      - name: Validate TEXT and ColorFix2 BG packing against MAME
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog

          python3 - <<'PY'
          # --- TEXT: MAME tiles8x8_layout ---
          B=[0xA5,0x3C,0x96,0x69]
          def plane(hi,lo):
              v=0
              for b in B:
                  v=(v<<1)|((b>>hi)&1)
                  v=(v<<1)|((b>>lo)&1)
              return v
          text_expected=(plane(6,7)<<24)|(plane(4,5)<<16)|(plane(2,3)<<8)|plane(0,1)
          assert text_expected == 0x4679B986
          print('PASS: TEXT MAME reference unpack = 4679B986')

          # --- BG0/BG1: MAME wwf_tile_layout ---
          # MAME plane offsets are {8,0,half+8,half+0}; those contribute
          # pixel bits 3,2,1,0 respectively:
          #   IC2 odd=P3, IC2 even=P2, IC1 odd=P1, IC1 even=P0.
          A0=0x96  # IC2 even -> P2
          A1=0x3C  # IC2 odd  -> P3
          B0=0xA5  # IC1 even -> P0
          B1=0x69  # IC1 odd  -> P1

          # MRA output16 emits stream bytes IC2,IC1,IC2,IC1.
          stream=[A0,B0,A1,B1]

          # SWAB=1 writes stream even bytes to SDRAM low lanes and odd bytes
          # to high lanes. The 32-bit reader returns two 16-bit words as
          # {second_word,first_word}, so raw byte lanes LSB->MSB are:
          # [P2,P0,P3,P1].
          word0=(stream[1]<<8)|stream[0]
          word1=(stream[3]<<8)|stream[2]
          raw=(word1<<16)|word0
          assert raw == 0x693CA596
          raw_bytes=[(raw>>(8*i))&0xff for i in range(4)]
          assert raw_bytes == [A0,B0,A1,B1]

          # ColorFix2 Verilog:
          # {raw[23:16],raw[7:0],raw[31:24],raw[15:8]}
          # -> {P3,P2,P1,P0}. jtframe_tilemap wants MSB=leftmost pixel,
          # so no bit reversal is applied here.
          packed=(raw_bytes[2]<<24)|(raw_bytes[0]<<16)|(raw_bytes[3]<<8)|raw_bytes[1]
          assert packed == 0x3C9669A5

          p3=(packed>>24)&0xff
          p2=(packed>>16)&0xff
          p1=(packed>> 8)&0xff
          p0= packed     &0xff

          mame=[]
          jt=[]
          for x in range(8):
              sh=7-x
              m=((A1>>sh)&1)<<3 | ((A0>>sh)&1)<<2 | ((B1>>sh)&1)<<1 | ((B0>>sh)&1)
              j=((p3>>sh)&1)<<3 | ((p2>>sh)&1)<<2 | ((p1>>sh)&1)<<1 | ((p0>>sh)&1)
              mame.append(m)
              jt.append(j)

          assert jt == mame

          # Demonstrate that the old BGFix1 order {P1,P0,P3,P2} is wrong.
          oldpacked=(raw_bytes[3]<<24)|(raw_bytes[1]<<16)|(raw_bytes[2]<<8)|raw_bytes[0]
          op3=(oldpacked>>24)&0xff
          op2=(oldpacked>>16)&0xff
          op1=(oldpacked>> 8)&0xff
          op0= oldpacked     &0xff
          old=[]
          for x in range(8):
              sh=7-x
              old.append(((op3>>sh)&1)<<3 | ((op2>>sh)&1)<<2 | ((op1>>sh)&1)<<1 | ((op0>>sh)&1))
          assert old != mame

          print('PASS: gfx3 raw lanes after MRA+SWAB = P2,P0,P3,P1')
          print('PASS: ColorFix2 restores BG/FG {P3,P2,P1,P0}')
          print('PASS: old BGFix1 {P1,P0,P3,P2} demonstrably gives wrong colour indices')
          print('PASS: all 8 BG/FG test pixels match MAME wwf_tile_layout')
          PY

      - name: Apply CRT SyncFix1 - move external HSYNC 32 pixels later
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s = p.read_text()

          # Keep the original HS phase for internal rendering logic.
          # Only the HS pulse exported to MiSTer/CRT is moved.
          if 'wire [8:0] hcnt, vcnt;' not in s:
              raise SystemExit('Expected hcnt/vcnt declaration not found')
          s = s.replace(
              'wire [8:0] hcnt, vcnt;',
              'wire [8:0] hcnt, vcnt;\nwire       HS_INT;',
              1
          )

          old_timing = '''    .rst(rst), .clk(clk), .pxl_cen(pxl_cen), .hcnt(hcnt), .vcnt(vcnt),
              .LHBL(LHBL), .LVBL(LVBL), .HS(HS), .VS(VS), .irq2_tick(irq2_tick)
          );'''
          new_timing = '''    .rst(rst), .clk(clk), .pxl_cen(pxl_cen), .hcnt(hcnt), .vcnt(vcnt),
              .LHBL(LHBL), .LVBL(LVBL), .HS(HS_INT), .VS(VS), .irq2_tick(irq2_tick)
          );'''

          if old_timing not in s:
              raise SystemExit('Expected timing instantiation not found')
          s = s.replace(old_timing, new_timing, 1)

          # FG, BG and object scanline engines continue to see the old/internal HS.
          n = s.count('.hs(HS)')
          if n != 3:
              raise SystemExit(f'Expected exactly 3 internal .hs(HS) users, found {n}')
          s = s.replace('.hs(HS)', '.hs(HS_INT)')

          # Existing provisional timing:
          #   active 0..319, old HS 336..367, total 448
          #   front porch 16, sync 32, back porch 80
          #
          # CRT SyncFix1 external timing:
          #   active 0..319, new HS 368..399, total 448
          #   front porch 48, sync 32, back porch 48
          #
          # This moves the active raster 32 pixels LEFT relative to sync while
          # preserving line frequency and sync width.
          insert_after = '''jtwwfw_timing u_timing(
              .rst(rst), .clk(clk), .pxl_cen(pxl_cen), .hcnt(hcnt), .vcnt(vcnt),
              .LHBL(LHBL), .LVBL(LVBL), .HS(HS_INT), .VS(VS), .irq2_tick(irq2_tick)
          );
          '''
          if insert_after not in s:
              raise SystemExit('Patched timing block not found for HS insertion')

          s = s.replace(
              insert_after,
              insert_after + "\n// External CRT-centred horizontal sync; internal raster timing remains unchanged.\n"
                             "assign HS = (hcnt >= 9'd368 && hcnt < 9'd400);\n",
              1
          )

          p.write_text(s)

          final = p.read_text()
          assert 'wire       HS_INT;' in final
          assert '.HS(HS_INT)' in final
          assert final.count('.hs(HS_INT)') == 3
          assert "assign HS = (hcnt >= 9'd368 && hcnt < 9'd400);" in final
          assert '.hs(HS)' not in final

          print('PASS: internal scanline timing remains on original HS phase')
          print('PASS: external HSYNC moved +32 pixels: 368..399')
          print('PASS: external porches are now front=48, sync=32, back=48')
          print('PASS: expected CRT raster shift is ~32 pixels to the left')
          PY

      - name: Validate CRT SyncFix1 geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          t = Path('cores/wwfwfest/hdl/jtwwfw_timing.v').read_text()
          v = Path('cores/wwfwfest/hdl/jtwwfw_video.v').read_text()

          def lp(name):
              m = re.search(rf'localparam\s+\[8:0\]\s+{name}\s*=\s*9\\'d(\d+)', t)
              if not m:
                  raise SystemExit(f'{name} not found')
              return int(m.group(1))

          htotal  = lp('H_TOTAL')
          hactive = lp('H_ACTIVE')
          old_b   = lp('H_SYNC_B')
          old_e   = lp('H_SYNC_E')

          assert htotal == 448
          assert hactive == 320
          assert (old_b, old_e) == (336, 368)
          assert old_e-old_b == 32

          new_b, new_e = 368, 400
          assert new_e-new_b == 32
          assert new_e < htotal

          old_front = old_b-hactive
          old_back  = htotal-old_e
          new_front = new_b-hactive
          new_back  = htotal-new_e

          assert (old_front, old_back) == (16, 80)
          assert (new_front, new_back) == (48, 48)

          assert "assign HS = (hcnt >= 9'd368 && hcnt < 9'd400);" in v
          assert v.count('.hs(HS_INT)') == 3

          print(f'PASS: total={htotal}, active={hactive}, sync width=32 unchanged')
          print(f'PASS: old porch F/B={old_front}/{old_back}')
          print(f'PASS: new porch F/B={new_front}/{new_back}')
          print('PASS: pixel clock and vertical timing are untouched')
          PY

      - name: Revalidate free-running video timing
        run: |
          FRAC_CEN="$(find modules/jtframe -name jtframe_frac_cen.v -print -quit)"
          test -n "$FRAC_CEN"
          iverilog -DSIMULATION -g2005 -Wall -o /tmp/timing_tb \
            cores/wwfwfest/ver/timing_tb.v cores/wwfwfest/hdl/jtwwfw_timing.v "$FRAC_CEN"
          vvp /tmp/timing_tb

      - name: Compile MiSTer RBF
        run: |
          docker run --network host -v "$(pwd)":/jtcores jotego/jtcore20 \
            /jtcores/modules/jtframe/devops/xjtcore.sh wwfwfest mister

      - name: Install exact final MRA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          data=base64.b64decode("")
          m=Path('release/mra/WWF WrestleFest (World).mra')
          m.write_bytes(data)
          x=m.read_text()
          assert '<about author="Misterlaleche"/>' in x
          assert 'default="ef,ff"' in x
          assert '<dip name="Flip Screen" bits="6" ids="On,Off"/>' in x
          for bad in ('jotego','patreon','twitter','Core credits'):
              assert bad.lower() not in x.lower(), bad
          print('PASS: exact project MRA installed after JTFRAME generation')
          PY

      - name: Verify compiled core requested OSD no-logo mode
        run: |
          grep -q 'JTFRAME_OSD_NOLOGO' cores/wwfwfest/cfg/macros.def
          echo 'PASS: JTFRAME_OSD_NOLOGO enabled for this build'

      - name: Collect MiSTer files
        run: |
          mkdir -p wwfwfest-release
          cp release/mister/jtwwfwfest.rbf wwfwfest-release/
          cp 'release/mra/WWF WrestleFest (World).mra' wwfwfest-release/
          sha256sum wwfwfest-release/jtwwfwfest.rbf > wwfwfest-release/SHA256.txt

      - name: Upload RBF and MRA
        uses: actions/upload-artifact@v6
        with:
          name: WWF-WrestleFest-MiSTer-ColorFix2-CRTSyncFix1
          path: wwfwfest-release
          retention-days: 30
