name: Build WWF WrestleFest TEXT fix 1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-wwfwfest-textfix1.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check out required modules
        run: |
          git submodule update --init --depth=1 \
            modules/fx68k modules/jt51 modules/jt6295

      - name: Restore FreeRunSync baseline
        run: |
          BASE=.github/workflows/build-wwfwfest-freerun-sync.yml
          test -f "$BASE"
          CORE_ARCHIVE="$(sed -n 's/^          CORE_ARCHIVE: //p' "$BASE" | head -n1)"
          test -n "$CORE_ARCHIVE"
          printf '%s' "$CORE_ARCHIVE" | base64 --decode > /tmp/wwfwfest-source.zip
          unzip -q -o /tmp/wwfwfest-source.zip
          test -f cores/wwfwfest/hdl/jtwwfw_video.v

      - name: Apply TEXT unpack correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s=p.read_text()
          old='''assign char_sorted = {
              char_data[15],char_data[14],char_data[ 7],char_data[ 6],
              char_data[31],char_data[30],char_data[23],char_data[22],
              char_data[13],char_data[12],char_data[ 5],char_data[ 4],
              char_data[29],char_data[28],char_data[21],char_data[20],
              char_data[11],char_data[10],char_data[ 3],char_data[ 2],
              char_data[27],char_data[26],char_data[19],char_data[18],
              char_data[ 9],char_data[ 8],char_data[ 1],char_data[ 0],
              char_data[25],char_data[24],char_data[17],char_data[16]
          };'''
          new='''assign char_sorted = {
              char_data[ 7],char_data[ 6],char_data[15],char_data[14],
              char_data[23],char_data[22],char_data[31],char_data[30],
              char_data[ 5],char_data[ 4],char_data[13],char_data[12],
              char_data[21],char_data[20],char_data[29],char_data[28],
              char_data[ 3],char_data[ 2],char_data[11],char_data[10],
              char_data[19],char_data[18],char_data[27],char_data[26],
              char_data[ 1],char_data[ 0],char_data[ 9],char_data[ 8],
              char_data[17],char_data[16],char_data[25],char_data[24]
          };'''
          if old not in s:
              raise SystemExit('Expected FreeRunSync char_sorted block not found')
          p.write_text(s.replace(old,new))

          # Keep project attribution requested by the port owner.
          m=Path('release/mra/WWF WrestleFest (World).mra')
          x=m.read_text()
          x=re.sub(r'^\s*<!--.*?-->\s*', '', x, count=1, flags=re.S)
          x=re.sub(r'<about\b[^>]*/>', '<about author="Misterlaleche"/>', x, count=1)
          x=x.replace('Punch,Kick,Start,Coin,Core credits','Punch,Kick,Start,Coin')
          x=x.replace('A,B,Start,Select,-','A,B,Start,Select')
          m.write_text(x)
          PY

      - name: Validate JTFRAME download byte order and TEXT unpack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iverilog

          python3 - <<'PY'
          # MAME tiles8x8_layout: planes {0,2,4,6}; x={1,0,65,64,...}
          B=[0xA5,0x3C,0x96,0x69]
          def plane(hi,lo):
              v=0
              for b in B:
                  v=(v<<1)|((b>>hi)&1)
                  v=(v<<1)|((b>>lo)&1)
              return v
          expected=(plane(7,6)<<24)|(plane(5,4)<<16)|(plane(3,2)<<8)|plane(1,0)
          assert expected == 0x89B67649
          print('PASS: MAME reference unpack = 89B67649')
          PY

          DWNLD="$(find modules/jtframe -name jtframe_dwnld.v -print -quit)"
          test -n "$DWNLD"
          cat >/tmp/char_download_tb.v <<'VERILOG'
          `timescale 1ns/1ps
          module char_download_tb;
            reg clk=0; always #10 clk=~clk;
            reg ioctl_rom=1, ioctl_wr=0, gfx8_en=0;
            reg [26:0] ioctl_addr=0; reg [7:0] ioctl_dout=0;
            wire [22:1] prog_addr; wire [15:0] prog_data;
            wire [1:0] prog_mask, prog_ba; wire prog_we, prog_rd, prom_we, header;
            jtframe_dwnld #(.SDRAMW(23),.BA1_START(27'h080000),
              .BA2_START(27'h110000),.BA3_START(27'h200000),.SWAB(1),.GFX8B0(0)) d(
              .clk(clk),.ioctl_rom(ioctl_rom),.ioctl_addr(ioctl_addr),.ioctl_dout(ioctl_dout),
              .ioctl_wr(ioctl_wr),.prog_addr(prog_addr),.prog_data(prog_data),.prog_mask(prog_mask),
              .prog_we(prog_we),.prog_rd(prog_rd),.prog_ba(prog_ba),.gfx4_en(1'b0),
              .gfx8_en(gfx8_en),.gfx16_en(1'b0),.gfx16b_en(1'b0),.gfx16c_en(1'b0),
              .prom_we(prom_we),.header(header),.sdram_ack(1'b1));
            reg [7:0] mem[0:255], raw[0:31]; integer i,y,k,wi;
            always @(posedge clk) if(prog_we && prog_ba==2) begin
              wi=prog_addr;
              if(!prog_mask[0]) mem[wi*2]=prog_data[7:0];
              if(!prog_mask[1]) mem[wi*2+1]=prog_data[15:8];
            end
            task send; input [26:0] a; input [7:0] v; begin
              ioctl_addr=a; ioctl_dout=v; ioctl_wr=1; gfx8_en=1; @(posedge clk);
              ioctl_wr=0; @(posedge clk); @(posedge clk); end endtask
            reg [31:0] cd;
            wire [31:0] sorted={cd[7],cd[6],cd[15],cd[14],cd[23],cd[22],cd[31],cd[30],
              cd[5],cd[4],cd[13],cd[12],cd[21],cd[20],cd[29],cd[28],
              cd[3],cd[2],cd[11],cd[10],cd[19],cd[18],cd[27],cd[26],
              cd[1],cd[0],cd[9],cd[8],cd[17],cd[16],cd[25],cd[24]};
            initial begin
              for(i=0;i<256;i=i+1) mem[i]=0; for(i=0;i<32;i=i+1) raw[i]=0;
              raw[0]=8'hA5; raw[8]=8'h3C; raw[16]=8'h96; raw[24]=8'h69;
              for(i=0;i<32;i=i+1) send(27'h110000+i,raw[i]);
              ioctl_rom=0; gfx8_en=0; repeat(6) @(posedge clk);
              for(y=0;y<8;y=y+1) for(k=0;k<4;k=k+1)
                if(mem[y*4+k]!==raw[k*8+y]) begin
                  $display("FAIL gfx_sort y=%0d k=%0d got=%02x exp=%02x",y,k,mem[y*4+k],raw[k*8+y]); $finish; end
              cd={mem[3],mem[2],mem[1],mem[0]};
              if(cd!==32'h69963CA5) begin $display("FAIL byte order %08x",cd); $finish; end
              if(sorted!==32'h89B67649) begin $display("FAIL unpack %08x",sorted); $finish; end
              $display("PASS: actual jtframe_dwnld HHVVV->VVVHH and byte lanes verified");
              $display("PASS: corrected TEXT plane unpack verified"); $finish;
            end
          endmodule
          VERILOG
          iverilog -DSIMULATION -g2005 -Wall -o /tmp/char_download_tb /tmp/char_download_tb.v "$DWNLD"
          vvp /tmp/char_download_tb

      - name: Revalidate free-running video timing
        run: |
          FRAC_CEN="$(find modules/jtframe -name jtframe_frac_cen.v -print -quit)"
          iverilog -DSIMULATION -g2005 -Wall -o /tmp/timing_tb \
            cores/wwfwfest/ver/timing_tb.v cores/wwfwfest/hdl/jtwwfw_timing.v "$FRAC_CEN"
          vvp /tmp/timing_tb

      - name: Compile MiSTer RBF
        run: |
          docker run --network host -v "$(pwd)":/jtcores jotego/jtcore20 \
            /jtcores/modules/jtframe/devops/xjtcore.sh wwfwfest mister

      - name: Collect MiSTer files
        run: |
          mkdir -p wwfwfest-release
          cp release/mister/jtwwfwfest.rbf wwfwfest-release/
          cp 'release/mra/WWF WrestleFest (World).mra' wwfwfest-release/

      - name: Upload RBF and MRA
        uses: actions/upload-artifact@v6
        with:
          name: WWF-WrestleFest-MiSTer-TextFix1
          path: wwfwfest-release
          retention-days: 30
