name: Build WWF WrestleFest for MiSTer

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-wwfwfest.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out JTFRAME
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check out required public CPU and audio modules
        run: |
          git submodule update --init --depth=1 \
            modules/fx68k modules/jt51 modules/jt6295

      - name: Restore WWF WrestleFest core
        env:
          CORE_ARCHIVE: 
        run: |
          printf '%s' "$CORE_ARCHIVE" | base64 --decode > /tmp/wwfwfest-source.zip
          unzip -q -o /tmp/wwfwfest-source.zip
          test -f cores/wwfwfest/cfg/macros.def

      - name: Compile MiSTer RBF with JTFRAME
        run: |
          docker run --network host -v "$(pwd)":/jtcores \
            jotego/jtcore20 \
            /jtcores/modules/jtframe/devops/xjtcore.sh wwfwfest mister

      - name: Collect MiSTer files
        run: |
          mkdir -p wwfwfest-release
          find release -type f \( -iname '*wwfwfest*.rbf' -o -iname '*WrestleFest*.mra' \) \
            -exec cp -v {} wwfwfest-release/ \;
          test -n "$(find wwfwfest-release -type f -iname '*.rbf' -print -quit)"

      - name: Upload RBF and MRA
        uses: actions/upload-artifact@v6
        with:
          name: WWF-WrestleFest-MiSTer
          path: wwfwfest-release
          if-no-files-found: error
          retention-days: 30
