        run: |
          printf '%s' "$PROJECT_ARCHIVE" | base64 --decode > /tmp/wrestlefest-saturn-test01a.zip
          rm -rf wrestlefest-saturn-test01a project
          unzip -q /tmp/wrestlefest-saturn-test01a.zip
          mv project wrestlefest-saturn-test01a
          test -f wrestlefest-saturn-test01a/Makefile
          test -f wrestlefest-saturn-test01a/main.c
          test -s wrestlefest-saturn-test01a/assets/WWF_SPRITES.TEX
          test -s wrestlefest-saturn-test01a/assets/WWF_SPRITES.PAL
          echo "PASS: Test01A project restored"

      - name: Build Saturn ISO CUE with Yaul
        run: |
          docker pull ijacquez/yaul:latest
          docker run --rm \
            -v "$PWD:/work" \
            -w /work/wrestlefest-saturn-test01a \
            ijacquez/yaul:latest \
            /bin/bash -lc 'make clean && make'

      - name: Verify Saturn build outputs
        run: |
          echo "===== BUILD OUTPUTS ====="
          find wrestlefest-saturn-test01a -maxdepth 2 -type f \
            \( -iname '*.cue' -o -iname '*.iso' -o -iname '*.elf' -o -iname '*.map' \) \
            -print -exec ls -lh {} \;

          test -f wrestlefest-saturn-test01a/wrestlefest-saturn-test01a.cue
          test -f wrestlefest-saturn-test01a/wrestlefest-saturn-test01a.iso
          echo "PASS: bootable ISO/CUE generated"

      - name: Collect Saturn Test01A
        run: |
          mkdir -p saturn-test01a-release
          cp wrestlefest-saturn-test01a/wrestlefest-saturn-test01a.cue saturn-test01a-release/
          cp wrestlefest-saturn-test01a/wrestlefest-saturn-test01a.iso saturn-test01a-release/
          cp wrestlefest-saturn-test01a/README.md saturn-test01a-release/
          cp wrestlefest-saturn-test01a/docs/sprites_0000_03ff_preview.png saturn-test01a-release/
          sha256sum saturn-test01a-release/wrestlefest-saturn-test01a.* > saturn-test01a-release/SHA256.txt

      - name: Upload Saturn Test01A
        uses: actions/upload-artifact@v6
        with:
          name: WWF-WrestleFest-Saturn-Test01A
          path: saturn-test01a-release
          if-no-files-found: error
          retention-days: 30
