name: Build WWF WrestleFest GFXFIX3 96M-B

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-wwfwfest-gfxfix3-96m-b.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Check out required modules
        run: |
          git submodule update --init --depth=1 \
            modules/fx68k modules/jt51 modules/jt6295

      - name: Restore known FreeRunSync baseline
        run: |
          BASE=.github/workflows/build-wwfwfest-freerun-sync.yml
          test -f "$BASE"
          CORE_ARCHIVE="$(sed -n 's/^          CORE_ARCHIVE: //p' "$BASE" | head -n1)"
          test -n "$CORE_ARCHIVE"
          printf '%s' "$CORE_ARCHIVE" | base64 --decode > /tmp/wwfwfest-source.zip
          unzip -q -o /tmp/wwfwfest-source.zip
          test -f cores/wwfwfest/hdl/jtwwfw_video.v
          test -f cores/wwfwfest/hdl/jtwwfw_obj.v

      - name: Apply TEXT fix2 and ColorFix2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          vpath = Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s = vpath.read_text()

          text_bits = [
              6,7,14,15,22,23,30,31,
              4,5,12,13,20,21,28,29,
              2,3,10,11,18,19,26,27,
              0,1,8,9,16,17,24,25
          ]
          new_char = "assign char_sorted = {\n    " + \
              ",".join(f"char_data[{i:2d}]" for i in text_bits) + \
              "\n};"

          s, n = re.subn(
              r'assign\s+char_sorted\s*=\s*\{.*?\};',
              new_char,
              s,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'TEXT char_sorted block not found exactly once: {n}')

          for sig in ('fgrom_data','bgrom_data'):
              pat = re.compile(
                  r'\.rom_data\(\{\s*' + re.escape(sig) +
                  r'\[\s*8\s*\].*?' + re.escape(sig) +
                  r'\[\s*23\s*\]\s*\}\)',
                  re.S
              )
              repl = (
                  '.rom_data({' +
                  sig + '[23:16],' +
                  sig + '[7:0],' +
                  sig + '[31:24],' +
                  sig + '[15:8]})'
              )
              s, n = pat.subn(repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'{sig} legacy unpack block not found exactly once: {n}')

          vpath.write_text(s)

          opath = Path('cores/wwfwfest/hdl/jtwwfw_obj.v')
          o = opath.read_text()

          sprite_bits = list(range(32))
          new_sorted = "wire [31:0] sorted = {\n    " + \
              ",".join(f"obj_data[{i:2d}]" for i in sprite_bits) + \
              "\n};"

          o, n = re.subn(
              r'wire\s*\[\s*31\s*:\s*0\s*\]\s*sorted\s*=\s*\{.*?\};',
              new_sorted,
              o,
              count=1,
              flags=re.S
          )
          if n != 1:
              raise SystemExit(f'Sprite sorted block not found exactly once: {n}')

          opath.write_text(o)

          macros = Path('cores/wwfwfest/cfg/macros.def')
          m = macros.read_text()
          if 'JTFRAME_OSD_NOLOGO' not in m:
              m = m.rstrip() + '\n\nJTFRAME_OSD_NOLOGO\n'
          macros.write_text(m)

          finalv = vpath.read_text()
          finalo = opath.read_text()

          assert 'char_data[ 6],char_data[ 7],char_data[14],char_data[15]' in finalv
          assert 'fgrom_data[23:16],fgrom_data[7:0],fgrom_data[31:24],fgrom_data[15:8]' in finalv
          assert 'bgrom_data[23:16],bgrom_data[7:0],bgrom_data[31:24],bgrom_data[15:8]' in finalv
          assert 'obj_data[ 0],obj_data[ 1],obj_data[ 2],obj_data[ 3]' in finalo

          print('PASS: TEXT fix2 installed')
          print('PASS: ColorFix2 FG/BG installed')
          print('PASS: ColorFix2 sprites installed')
          PY

      - name: Apply HFIX0 sprite edge fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cores/wwfwfest/hdl/jtwwfw_obj.v')
          s = p.read_text()

          old = '.HJUMP(0),.LATCH(1),.PACKED(0),'
          new = '.HJUMP(0),.HFIX(0),.LATCH(1),.PACKED(0),'

          if old not in s:
              raise SystemExit('Expected objdraw HJUMP/LATCH/PACKED parameter sequence not found')

          s = s.replace(old, new, 1)
          p.write_text(s)

          assert '.HFIX(0)' in p.read_text()
          print('PASS: HFIX=0 installed; left-edge sprite loss corrected')
          PY

      - name: Run core and SDRAM at 96 MHz while preserving PCB clocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # JTFRAME supports clk=96 MHz when JTFRAME_SDRAM96 is defined.
          # Keep all PCB-derived effective clocks unchanged.
          macros = Path('cores/wwfwfest/cfg/macros.def')
          m = macros.read_text()
          if 'JTFRAME_SDRAM96' not in m:
              m = m.rstrip() + '\nJTFRAME_SDRAM96\n'
          macros.write_text(m)

          game = Path('cores/wwfwfest/hdl/jtwwfwfest_game.v')
          g = game.read_text()
          old = "jtframe_frac_cen #(.W(2),.WC(5)) u_pxl_cen(\n    .clk(clk), .n(5'd7), .m(5'd24), .cen(pxl_cens), .cenb()\n);"
          new = "jtframe_frac_cen #(.W(2),.WC(6)) u_pxl_cen(\n    .clk(clk), .n(6'd7), .m(6'd48), .cen(pxl_cens), .cenb()\n);"
          if old not in g:
              raise SystemExit('48 MHz pixel fractional CEN block not found')
          game.write_text(g.replace(old,new,1))

          main = Path('cores/wwfwfest/hdl/jtwwfw_main.v')
          q = main.read_text()
          old = ".num(7'd6), .den(8'd24), .DTACKn(DTACKn),"
          new = ".num(7'd6), .den(8'd48), .DTACKn(DTACKn),"
          if old not in q:
              raise SystemExit('68000 12 MHz CEN ratio not found')
          main.write_text(q.replace(old,new,1))

          timing = Path('cores/wwfwfest/hdl/jtwwfw_timing.v')
          t = timing.read_text()
          changes = [
              ("localparam [14:0] IRQ2_DIV = 15'd29448;", "localparam [15:0] IRQ2_DIV = 16'd58896;"),
              ("reg [14:0] irq2_div;", "reg [15:0] irq2_div;"),
              ("if(irq2_div == 15'd29447)", "if(irq2_div == 16'd58895)")
          ]
          for old,new in changes:
              if old not in t:
                  raise SystemExit('IRQ2 48 MHz timing expression not found: '+old)
              t=t.replace(old,new,1)
          timing.write_text(t)

          assert 'JTFRAME_SDRAM96' in macros.read_text()
          assert ".m(6'd48)" in game.read_text()
          assert ".den(8'd48)" in main.read_text()
          assert "16'd58895" in timing.read_text()
          print('PASS: JTFRAME main+SDRAM set to 96 MHz')
          print('PASS: pixel clock remains exactly 7 MHz')
          print('PASS: 68000 remains 12 MHz')
          print('PASS: IRQ2 remains ~1.630 kHz')
          PY

      - name: Fix tilemap first-8-pixel pipeline and layer/sprite X registration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s = p.read_text()

          decl = 'wire [8:0] hcnt, vcnt;'
          if decl not in s:
              raise SystemExit('hcnt/vcnt declaration not found')

          hfetch = (
              "\n// JTFRAME tilemap outputs one 8-pixel fetch group after the address phase.\n"
              "// Rotate the 448-pixel raster by one group for tile layers only so\n"
              "// h=440..447 prefetches logical x=0..7 before active video starts.\n"
              "// Sprites keep native hcnt coordinates; this also restores tile/sprite X registration.\n"
              "wire [8:0] htile = (hcnt >= 9'd440) ? (hcnt - 9'd440) : (hcnt + 9'd8);\n"
          )
          s = s.replace(decl, decl + hfetch, 1)

          old = '.vdump(vpos), .hdump(hcnt), .blankn(LVBL), .flip(flip),'
          new = '.vdump(vpos), .hdump(htile), .blankn(LVBL), .flip(flip),'
          n = s.count(old)
          if n != 3:
              raise SystemExit(f'Expected exactly 3 tile-layer hdump users, found {n}')
          s = s.replace(old, new)

          p.write_text(s)

          final = p.read_text()
          assert final.count('.hdump(htile)') == 3
          assert final.count('.hdump(hcnt)') == 1   # object renderer only
          assert "hcnt >= 9'd440" in final
          print('PASS: text/FG/BG prefetch rotated +8 pixels modulo 448')
          print('PASS: sprite hdump remains native hcnt')
          print('PASS: expected fixes: left-edge tile garbage + selector/layer X registration')
          PY

      - name: Verify native 0..239 vertical layer coordinates
        run: |
          grep -q "wire \[8:0\] vpos = vcnt - 9'd8;" cores/wwfwfest/hdl/jtwwfw_video.v
          echo "PASS: active line 8 maps to graphics Y=0; active line 247 maps to Y=239"

      - name: Apply Technos one-extra-pixel left-edge phase fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cores/wwfwfest/hdl/jtwwfw_timing.v')
          s=p.read_text()
          old='assign LHBL = hcnt < H_ACTIVE;'
          new=("// TA-0031 renderer needs one extra horizontal source pixel; expose\n"
               "// a 320-pixel window at h=1..320 instead of the junk wrap pixel h=0.\n"
               "assign LHBL = hcnt >= 9'd1 && hcnt < 9'd321;")
          if old not in s:
              raise SystemExit('native LHBL assignment not found')
          p.write_text(s.replace(old,new,1))
          assert "hcnt >= 9'd1 && hcnt < 9'd321" in p.read_text()
          print('PASS: 320 visible pixels now use h=1..320; junk left wrap pixel hidden')
          PY

      - name: Apply CRT centering 40 pixels left
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('cores/wwfwfest/hdl/jtwwfw_video.v')
          s = p.read_text()

          old_decl = 'wire [8:0] hcnt, vcnt;'
          new_decl = 'wire [8:0] hcnt, vcnt;\nwire       HS_INT;'
          if old_decl not in s:
              raise SystemExit('hcnt/vcnt declaration not found')
          s = s.replace(old_decl, new_decl, 1)

          old_timing = (
              '    .rst(rst), .clk(clk), .pxl_cen(pxl_cen), .hcnt(hcnt), .vcnt(vcnt),\n'
              '    .LHBL(LHBL), .LVBL(LVBL), .HS(HS), .VS(VS), .irq2_tick(irq2_tick)\n'
              ');'
          )
          new_timing = (
              '    .rst(rst), .clk(clk), .pxl_cen(pxl_cen), .hcnt(hcnt), .vcnt(vcnt),\n'
              '    .LHBL(LHBL), .LVBL(LVBL), .HS(HS_INT), .VS(VS), .irq2_tick(irq2_tick)\n'
              ');'
          )
          if old_timing not in s:
              raise SystemExit('Timing instantiation not found')
          s = s.replace(old_timing, new_timing, 1)

          if s.count('.hs(HS)') != 3:
              raise SystemExit(f'Expected 3 internal HS users; found {s.count(".hs(HS)")}')
          s = s.replace('.hs(HS)', '.hs(HS_INT)')

          marker = new_timing + '\n'
          external = (
              "// External CRT-centred HSYNC: +40 px relative to original.\n"
              "// Active raster moves about 40 pixels left; total remains 448.\n"
              "assign HS = (hcnt >= 9'd376 && hcnt < 9'd408);\n"
          )
          if marker not in s:
              raise SystemExit('Patched timing marker not found')
          s = s.replace(marker, marker + '\n' + external, 1)

          p.write_text(s)

          final = p.read_text()
          assert final.count('.hs(HS_INT)') == 3
          assert "assign HS = (hcnt >= 9'd376 && hcnt < 9'd408);" in final
          print('PASS: CRT centering installed')
          print('PASS: external HSYNC = 376..407')
          print('PASS: porches = front 56 / sync 32 / back 40')
          print('PASS: expected raster shift = ~40 pixels left')
          PY

      - name: Verify JT6295 interface before compile
        run: |
          test -f modules/jt6295/hdl/jt6295.v
          if grep -q "rom_cs" modules/jt6295/hdl/jt6295.v; then
            echo "Unexpected: jt6295 exposes rom_cs"
            exit 1
          fi
          grep -q "assign pcm_cs   = 1'b1;" cores/wwfwfest/hdl/jtwwfw_sound.v
          echo "PASS: jt6295 has no rom_cs port; original PCM handshake retained"

      - name: Compile MiSTer RBF
        run: |
          docker run --network host -v "$(pwd)":/jtcores jotego/jtcore20 \
            /jtcores/modules/jtframe/devops/xjtcore.sh wwfwfest mister

      - name: Show Quartus diagnostics after a failure
        if: failure()
        run: |
          echo "===== MAIN JTCORE / QUARTUS LOGS ====="
          for f in log/mister/jtwwfwfest.log cores/wwfwfest/seed/mister/0/jtcore.log; do
            if [ -f "$f" ]; then
              echo "----- $f -----"
              tail -n 500 "$f"
            fi
          done

          echo "===== REPORTS ====="
          find cores/wwfwfest/seed/mister/0 -type f \
            \( -iname '*.log' -o -iname '*.rpt' -o -iname '*.msg' \) \
            -print 2>/dev/null | while IFS= read -r report; do
              echo "----- $report -----"
              tail -n 250 "$report"
            done

      - name: Restore exact known-good project MRA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          src = Path('.github/workflows/build-wwfwfest-colorfix2-crtsyncfix1.yml').read_text()
          m = re.search(r'data=base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', src)
          if not m:
              raise SystemExit('Known-good MRA payload not found in ColorFix2+CRTSyncFix1 workflow')

          out = Path('release/mra/WWF WrestleFest (World).mra')
          out.write_bytes(base64.b64decode(m.group(1)))

          text = out.read_text()
          assert '<name>WWF WrestleFest (World)</name>' in text
          assert '<dip name="Flip Screen" bits="6" ids="On,Off"/>' in text
          print('PASS: exact known-good MRA restored')
          PY

      - name: Collect MiSTer files
        run: |
          mkdir -p wwfwfest-release
          cp release/mister/jtwwfwfest.rbf wwfwfest-release/
          cp 'release/mra/WWF WrestleFest (World).mra' wwfwfest-release/
          sha256sum wwfwfest-release/jtwwfwfest.rbf > wwfwfest-release/SHA256.txt

      - name: Upload RBF and MRA
        uses: actions/upload-artifact@v6
        with:
          name: WWF-WrestleFest-GFXFIX3-96M-B
          path: wwfwfest-release
          if-no-files-found: error
          retention-days: 30
